name: EntityAiRange
version: 0.3.2
main: de.servertools.entityairange.EntityAiRangePlugin
api-version: '26.3'
description: Disables mob AI far from players and manages per-type despawn timers.
author: ServerTools
commands:
  entity:
    description: Adds or removes a despawn timer for Minecraft item or entity types.
    usage: /entity despawn <add|remove> <minecraft:typ> [Sekunden]
    permission: entityairange.admin
  entityairange:
    description: Opens the settings GUI or manages entities tracked by EntityAiRange.
    usage: /entityairange [gui|status|restore|resume]
    permission: entityairange.admin
    aliases: [eair]
permissions:
  entityairange.admin:
    description: Allows use of EntityAiRange commands.
    default: op
