# Mobs farther than this distance from every online player have their AI disabled.
disable-distance: 128

# How often loaded mobs are checked. 100 ticks = 5 seconds.
scan-interval-ticks: 100

# Print a summary to the console after each scan.
log-scan-summary: false

# Default lifetime for dropped items in seconds (15 to 300).
item-despawn-seconds: 300

# Custom type rules are managed with /entity despawn add|remove.
despawn-rules: {}
despawn-rule-ids: {}
