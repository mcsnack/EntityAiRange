name: Build plugin

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EntityAiRange-v0.1
          path: target/entity-ai-range-0.1.jar
      - name: Attach JAR to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" target/entity-ai-range-0.1.jar --clobber
